[package]
name = "telar-app"
description = "TELAR 3D: la aplicación que une la ventana y la GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Regla fronteras: la app es el único sitio que conoce a la vez la ventana, la GPU
# el compilador de kernels (hilo-spirv) y la geometría (nudo, telar-nodos): los une
# sin que se conozcan entre ellos.
[package.metadata.telar]
puede-usar = ["telar-ventana", "telar-gpu", "telar-kernel", "telar-render", "telar-ui", "hilo-spirv", "hilo", "nudo", "telar-nodos", "telar-intercambio"]

[[bin]]
name = "telar"
path = "src/main.rs"

[dependencies]
telar-ventana = { path = "../telar-ventana" }
telar-gpu = { path = "../telar-gpu" }
telar-kernel = { path = "../telar-kernel" }
telar-render = { path = "../telar-render" }
telar-ui = { path = "../telar-ui" }
hilo-spirv = { path = "../hilo-spirv" }
hilo = { path = "../hilo" }
nudo = { path = "../nudo" }
telar-nodos = { path = "../telar-nodos" }
telar-intercambio = { path = "../telar-intercambio" }

[lints]
workspace = true
